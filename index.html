<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomer Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0d0d14;
    --panel: #13131e;
    --border: #1f1f30;
    --accent: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e2e8f0;
    --muted: #64748b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 20%, rgba(59,130,246,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(34,197,94,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(13,13,20,0.8);
    backdrop-filter: blur(10px);
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.2rem;
    letter-spacing: -0.02em;
  }
  .logo span { color: var(--accent); }

  .tg-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.65rem;
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 100px;
    border: 1px solid var(--border);
  }
  .tg-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    animation: blink 2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  main {
    position: relative;
    z-index: 5;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 14px;
  }

  /* Nomer input */
  .nomer-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }

  .card-title {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .nomer-display {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    transition: border-color 0.3s;
    cursor: pointer;
    position: relative;
  }
  .nomer-display.has-value { border-color: var(--accent); }

  .nomer-text {
    font-family: 'Syne', sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--accent);
    min-height: 2rem;
  }
  .nomer-text.empty { color: var(--muted); font-size: 0.9rem; font-family: 'Space Mono'; font-weight: 400; }

  .nomer-flag {
    font-size: 1.8rem;
  }

  /* Keyboard */
  .keyboard {
    display: grid;
    gap: 6px;
  }

  .key-row {
    display: grid;
    gap: 6px;
  }

  .key-row-letters { grid-template-columns: repeat(10, 1fr); }
  .key-row-nums { grid-template-columns: repeat(10, 1fr); }
  .key-row-extra { grid-template-columns: repeat(5, 1fr) 2fr; }

  .key {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 4px;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    user-select: none;
    -webkit-user-select: none;
    min-height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .key:active { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(0.95); }

  .key.num { color: var(--accent); }
  .key.letter { color: var(--green); font-size: 0.7rem; }
  .key.del { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: var(--red); }
  .key.del:active { background: var(--red); }
  .key.space { grid-column: span 2; font-size: 0.65rem; color: var(--muted); }
  .key.clear { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.2); color: var(--red); font-size: 0.65rem; }

  /* Camera */
  .cam-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .cam-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .cam-preview {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    overflow: hidden;
  }

  #camCanvas {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .cam-overlay-idle {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #000;
  }
  .cam-overlay-idle .ci { font-size: 2.5rem; opacity: 0.2; }
  .cam-overlay-idle p { font-size: 0.7rem; color: var(--muted); text-align: center; }

  .cam-controls {
    padding: 12px 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .btn {
    padding: 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }
  .btn.blue { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,0.05); }
  .btn.blue:active { background: rgba(59,130,246,0.15); }
  .btn.green { border-color: var(--green); color: var(--green); background: rgba(34,197,94,0.05); }
  .btn.green:active { background: rgba(34,197,94,0.15); }
  .btn.red-btn { border-color: var(--red); color: var(--red); background: rgba(239,68,68,0.05); display: none; }

  /* Log */
  .log-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
  }

  .log-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 200px;
    overflow-y: auto;
  }
  .log-list::-webkit-scrollbar { width: 3px; }
  .log-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .log-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.68rem;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }

  .log-icon { font-size: 1rem; flex-shrink: 0; }
  .log-info { flex: 1; }
  .log-nomer { color: var(--accent); font-weight: 700; font-size: 0.78rem; }
  .log-desc { color: var(--muted); font-size: 0.62rem; margin-top: 1px; }
  .log-time { color: var(--muted); font-size: 0.6rem; flex-shrink: 0; }

  .log-item.success { border-color: rgba(34,197,94,0.3); }
  .log-item.error { border-color: rgba(239,68,68,0.3); }
  .log-item.info { border-color: rgba(59,130,246,0.3); }

  .empty-log { color: var(--muted); font-size: 0.72rem; text-align: center; padding: 16px 0; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 10px 20px;
    font-size: 0.75rem;
    z-index: 100;
    transition: transform 0.3s ease;
    white-space: nowrap;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.ok { border-color: rgba(34,197,94,0.4); color: var(--green); }
  .toast.err { border-color: rgba(239,68,68,0.4); color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="logo">UZ<span>NOMER</span></div>
  <div class="tg-status"><div class="tg-dot"></div>Telegram ulangan</div>
</header>

<main>
  <!-- Nomer kiritish -->
  <div class="nomer-card">
    <div class="card-title">🚗 Davlat raqami</div>
    <div class="nomer-display" id="nomerDisplay">
      <div class="nomer-text empty" id="nomerText">Raqam kiriting...</div>
      <div class="nomer-flag">🇺🇿</div>
    </div>

    <!-- Keyboard -->
    <div class="keyboard">
      <!-- Raqamlar -->
      <div class="key-row key-row-nums">
        <div class="key num" onclick="press('1')">1</div>
        <div class="key num" onclick="press('2')">2</div>
        <div class="key num" onclick="press('3')">3</div>
        <div class="key num" onclick="press('4')">4</div>
        <div class="key num" onclick="press('5')">5</div>
        <div class="key num" onclick="press('6')">6</div>
        <div class="key num" onclick="press('7')">7</div>
        <div class="key num" onclick="press('8')">8</div>
        <div class="key num" onclick="press('9')">9</div>
        <div class="key num" onclick="press('0')">0</div>
      </div>
      <!-- Harflar 1-qator -->
      <div class="key-row key-row-letters">
        <div class="key letter" onclick="press('A')">A</div>
        <div class="key letter" onclick="press('B')">B</div>
        <div class="key letter" onclick="press('C')">C</div>
        <div class="key letter" onclick="press('D')">D</div>
        <div class="key letter" onclick="press('E')">E</div>
        <div class="key letter" onclick="press('F')">F</div>
        <div class="key letter" onclick="press('G')">G</div>
        <div class="key letter" onclick="press('H')">H</div>
        <div class="key letter" onclick="press('I')">I</div>
        <div class="key letter" onclick="press('J')">J</div>
      </div>
      <!-- Harflar 2-qator -->
      <div class="key-row key-row-letters">
        <div class="key letter" onclick="press('K')">K</div>
        <div class="key letter" onclick="press('L')">L</div>
        <div class="key letter" onclick="press('M')">M</div>
        <div class="key letter" onclick="press('N')">N</div>
        <div class="key letter" onclick="press('O')">O</div>
        <div class="key letter" onclick="press('P')">P</div>
        <div class="key letter" onclick="press('R')">R</div>
        <div class="key letter" onclick="press('S')">S</div>
        <div class="key letter" onclick="press('T')">T</div>
        <div class="key letter" onclick="press('U')">U</div>
      </div>
      <!-- Harflar 3-qator + del -->
      <div class="key-row" style="grid-template-columns: repeat(7,1fr) 1.5fr 1.5fr">
        <div class="key letter" onclick="press('V')">V</div>
        <div class="key letter" onclick="press('X')">X</div>
        <div class="key letter" onclick="press('Y')">Y</div>
        <div class="key letter" onclick="press('Z')">Z</div>
        <div class="key letter" onclick="press('Q')">Q</div>
        <div class="key letter" onclick="press('W')">W</div>
        <div class="key letter" onclick="press(' ')" style="font-size:0.55rem;color:var(--muted)">BO'SH</div>
        <div class="key del" onclick="del()">⌫</div>
        <div class="key clear" onclick="clearAll()" style="font-size:0.6rem">CLR</div>
      </div>
    </div>
  </div>

  <!-- Kamera -->
  <div class="cam-card">
    <div class="cam-header">
      <div class="card-title" style="margin:0">📷 Kamera</div>
      <div id="camStatus" style="font-size:0.65rem;color:var(--muted)">O'chiq</div>
    </div>
    <div class="cam-preview">
      <canvas id="camCanvas"></canvas>
      <div class="cam-overlay-idle" id="camIdle">
        <div class="ci">📷</div>
        <p>Kamera o'chiq</p>
      </div>
    </div>
    <div class="cam-controls">
      <button class="btn blue" id="camOnBtn" onclick="camOn()">▶ KAMERA YOQISH</button>
      <button class="btn red-btn" id="camOffBtn" onclick="camOff()">■ O'CHIRISH</button>
      <button class="btn green" onclick="sendManual()" style="grid-column:span 2">📤 HOZIR YUBORISH</button>
    </div>
  </div>

  <!-- Log -->
  <div class="log-card">
    <div class="card-title">📋 Yuborish tarixi</div>
    <div class="log-list" id="logList">
      <div class="empty-log">Hali hech narsa yuborilmagan</div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<video id="vid" autoplay playsinline muted style="display:none"></video>

<script>
const BOT_TOKEN = '7567966600:AAE9h0Jp5QXxwI34kNqrVf55K00z-I010Po';
const CHAT_ID   = '6361138190';

const vid = document.getElementById('vid');
const camCanvas = document.getElementById('camCanvas');
const cctx = camCanvas.getContext('2d');

let nomer = '';
let camStream = null;
let camRunning = false;
let rafId = null;
let logs = [];

// ── Keyboard ──────────────────────────────────────────────────────────────────
function press(ch) {
  if (nomer.length >= 12) return;
  nomer += ch;
  updateDisplay();
}
function del() {
  nomer = nomer.slice(0, -1);
  updateDisplay();
}
function clearAll() {
  nomer = '';
  updateDisplay();
}
function updateDisplay() {
  const el = document.getElementById('nomerText');
  const disp = document.getElementById('nomerDisplay');
  if (nomer) {
    el.textContent = nomer;
    el.className = 'nomer-text';
    disp.classList.add('has-value');
  } else {
    el.textContent = 'Raqam kiriting...';
    el.className = 'nomer-text empty';
    disp.classList.remove('has-value');
  }
}

// ── Camera ────────────────────────────────────────────────────────────────────
async function camOn() {
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    vid.srcObject = camStream;
    await vid.play();
    camRunning = true;
    document.getElementById('camIdle').style.display = 'none';
    document.getElementById('camOnBtn').style.display = 'none';
    document.getElementById('camOffBtn').style.display = 'block';
    document.getElementById('camStatus').textContent = '🟢 Yoniq';
    document.getElementById('camStatus').style.color = '#22c55e';
    drawCam();
    // Kamera yonganda xabar yuborish
    await sendToTelegram('📷 Kamera YOQILDI');
    addLog('info', '📷', 'Kamera yoqildi', 'Telegram ga xabar yuborildi');
  } catch(e) {
    showToast('❌ Kameraga ruxsat berilmadi', 'err');
  }
}

function camOff() {
  camRunning = false;
  cancelAnimationFrame(rafId);
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  camStream = null;
  cctx.clearRect(0, 0, camCanvas.width, camCanvas.height);
  document.getElementById('camIdle').style.display = 'flex';
  document.getElementById('camOnBtn').style.display = 'block';
  document.getElementById('camOffBtn').style.display = 'none';
  document.getElementById('camStatus').textContent = "O'chiq";
  document.getElementById('camStatus').style.color = '';
  // Kamera o'chganda xabar yuborish
  sendToTelegram("📷 Kamera O'CHIRILDI").then(() => {
    addLog('info', '📴', "Kamera o'chirildi", 'Telegram ga xabar yuborildi');
  });
}

function drawCam() {
  if (!camRunning) return;
  rafId = requestAnimationFrame(drawCam);
  if (vid.readyState < 2) return;
  camCanvas.width = vid.videoWidth || 640;
  camCanvas.height = vid.videoHeight || 480;
  cctx.drawImage(vid, 0, 0);
}

// ── Snapshot ──────────────────────────────────────────────────────────────────
function takeSnapshot() {
  if (!camRunning || vid.readyState < 2) return null;
  const snap = document.createElement('canvas');
  snap.width = vid.videoWidth || 640;
  snap.height = vid.videoHeight || 480;
  const sctx = snap.getContext('2d');

  // Overlay: nomer va vaqt
  sctx.drawImage(vid, 0, 0);

  const now = new Date();
  const timeStr = now.toLocaleString('uz-UZ');
  const nomerStr = nomer || '(nomer kiritilmagan)';

  // Pastki panel
  sctx.fillStyle = 'rgba(0,0,0,0.65)';
  sctx.fillRect(0, snap.height - 70, snap.width, 70);

  // Nomer
  sctx.fillStyle = '#3b82f6';
  sctx.font = 'bold 28px monospace';
  sctx.fillText('🇺🇿 ' + nomerStr, 16, snap.height - 38);

  // Vaqt
  sctx.fillStyle = '#94a3b8';
  sctx.font = '14px monospace';
  sctx.fillText('🕐 ' + timeStr, 16, snap.height - 14);

  return snap.toDataURL('image/jpeg', 0.85);
}

// ── Telegram ──────────────────────────────────────────────────────────────────
async function sendToTelegram(caption) {
  const now = new Date().toLocaleString('uz-UZ');
  const nomerStr = nomer || '(nomer kiritilmagan)';
  const text = `🚗 *O'zbekiston davlat raqami*\n\n🔢 Raqam: \`${nomerStr}\`\n🕐 Vaqt: ${now}\n\n${caption}`;

  const snap = takeSnapshot();

  if (snap) {
    // Rasm bilan yuborish
    const blob = await (await fetch(snap)).blob();
    const form = new FormData();
    form.append('chat_id', CHAT_ID);
    form.append('photo', blob, 'snapshot.jpg');
    form.append('caption', text);
    form.append('parse_mode', 'Markdown');

    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: 'POST',
      body: form
    });
    return res.ok;
  } else {
    // Faqat matn yuborish (kamera o'chiq bo'lsa)
    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: text,
        parse_mode: 'Markdown'
      })
    });
    return res.ok;
  }
}

// ── Manual send ───────────────────────────────────────────────────────────────
async function sendManual() {
  if (!nomer.trim()) {
    showToast('⚠️ Avval raqam kiriting!', 'err');
    return;
  }
  showToast('📤 Yuborilmoqda...', 'ok');
  try {
    const ok = await sendToTelegram('📤 Qo\'lda yuborildi');
    if (ok) {
      showToast('✅ Telegram ga yuborildi!', 'ok');
      addLog('success', '✅', nomer, "Qo'lda yuborildi");
    } else {
      showToast('❌ Yuborishda xato!', 'err');
      addLog('error', '❌', nomer, 'Yuborishda xato');
    }
  } catch(e) {
    showToast('❌ Internet xatosi', 'err');
    addLog('error', '❌', nomer, 'Internet xatosi');
  }
}

// ── Log ───────────────────────────────────────────────────────────────────────
function addLog(type, icon, nomerVal, desc) {
  const now = new Date().toLocaleTimeString('uz-UZ');
  logs.unshift({ type, icon, nomer: nomerVal, desc, time: now });
  if (logs.length > 50) logs.pop();
  renderLog();
}

function renderLog() {
  const el = document.getElementById('logList');
  if (!logs.length) {
    el.innerHTML = '<div class="empty-log">Hali hech narsa yuborilmagan</div>';
    return;
  }
  el.innerHTML = logs.map(l => `
    <div class="log-item ${l.type}">
      <span class="log-icon">${l.icon}</span>
      <div class="log-info">
        <div class="log-nomer">${l.nomer}</div>
        <div class="log-desc">${l.desc}</div>
      </div>
      <span class="log-time">${l.time}</span>
    </div>`).join('');
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
</body>
        </html>
